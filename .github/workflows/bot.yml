name: bot
on:
  workflow_dispatch:
concurrency:
  group: bot
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Local Bot API server (optional; lifts the 20 MB file limit to 2 GB)
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if [ -n "$API_ID" ] && [ -n "$API_HASH" ]; then
            mkdir -p "$RUNNER_TEMP/tgdata"
            docker run -d --name tgapi -p 8081:8081 \
              -v "$RUNNER_TEMP/tgdata:/var/lib/telegram-bot-api" \
              -e TELEGRAM_API_ID="$API_ID" -e TELEGRAM_API_HASH="$API_HASH" -e TELEGRAM_LOCAL=1 \
              aiogram/telegram-bot-api:latest || true
            for i in $(seq 1 20); do
              if curl -s -o /dev/null http://127.0.0.1:8081/; then
                echo "TELEGRAM_API_URL=http://127.0.0.1:8081" >> "$GITHUB_ENV"
                echo "TELEGRAM_DATA=$RUNNER_TEMP/tgdata" >> "$GITHUB_ENV"
                echo "local Bot API server is up"; break
              fi
              sleep 2
            done
            docker ps -a; docker logs tgapi 2>&1 | tail -n 20
          fi
      - run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ALLOWED_CHAT_IDS: ${{ secrets.ALLOWED_CHAT_IDS }}
      - name: Save learned examples
        if: always()
        run: |
          if [ -n "$(git status --porcelain memory)" ]; then
            git config user.name "clip-bot"
            git config user.email "clip-bot@users.noreply.github.com"
            git add memory
            git commit -m "memory: save labelled interview"
            git pull --rebase -q || true
            git push || true
          fi
